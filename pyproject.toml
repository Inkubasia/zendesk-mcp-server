[project]
name = "zendesk-mcp-server"
version = "0.1.0"
description = "A simple Zendesk MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28.1",
    "python-dotenv>=1.0.1",
    "zenpy>=2.0.56",
    "starlette>=0.42.0",
    "uvicorn>=0.34.0",
]

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
zendesk = "zendesk_mcp_server:main"
zendesk-http = "zendesk_mcp_server.server:main_http"
